# Collects fresh posts every 2 hours and publishes the app to GitHub Pages.
name: Update Nation Pulse

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC), at 17 minutes past
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["app/**", "server.py", ".github/workflows/**"]

permissions:
  contents: write   # save the mood history back to the repo
  pages: write
  id-token: write
  models: read      # free GitHub AI models for sorting headlines

concurrency:
  group: nation-pulse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect, translate and sort posts
        run: python server.py --once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}   # optional: Instagram, X, Facebook via Apify's free plan

      - name: Save history (keeps the trend charts going)
        run: |
          git config user.name "nation-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M')"
          git push || echo "push skipped"

      - name: Make phones load the newest app files
        run: |
          v=${GITHUB_SHA::7}
          sed -i "s/app\.js\"/app.js?v=$v\"/; s/style\.css\"/style.css?v=$v\"/" app/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
